name: macOS

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -G Xcode
      - name: Build
        run: cmake --build build --config Release
      - name: Check app bundle
        run: test -d build/LiteHost_artefacts/Release/LiteHost.app
